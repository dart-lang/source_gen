# A CI configuration to auto-publish pub packages.
#
# Pushing a tag source_gen-vVERSION publishes package:source_gen.
# Publish checks on pull requests run in the Health workflow.

name: Publish
permissions:
  contents: read

on:
  push:
    tags: [ 'source_gen-v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
  publish:
    if: ${{ github.repository_owner == 'dart-lang' }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@a5bff6576dfc51b47eb77d4b7084bba6a4daf8d2 # main
    with:
      working-directory: source_gen
      use-flutter: false
